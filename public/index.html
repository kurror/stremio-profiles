<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stremio Perfiles</title>
<style>
:root {
  --bg: #0f0f13; --card: #1c1c28; --accent: #7c3aed; --accent2: #a78bfa;
  --text: #f1f0ff; --muted: #9ca3af; --border: #2d2d42; --danger: #ef4444; --success: #10b981;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; }

/* ── Header ── */
header { padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 1.3rem; font-weight: 700; }
header h1 span { color: var(--accent2); }
#activeBar { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: .5rem; }
#activeBar strong { color: var(--text); }
#btnLogout { background: none; border: 1px solid var(--border); color: var(--muted);
  padding: .3rem .7rem; border-radius: 6px; cursor: pointer; font-size: .8rem; }
#btnLogout:hover { border-color: var(--danger); color: var(--danger); }

/* ── Profile grid ── */
main { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 2rem 1rem; }
h2.section { font-size: 1rem; color: var(--muted); margin-bottom: 1.5rem; text-align: center; }

.grid { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; max-width: 900px; }

.profile-card {
  background: var(--card); border: 3px solid transparent; border-radius: 16px;
  padding: 2rem 1.5rem; min-width: 150px; text-align: center; cursor: pointer;
  transition: border-color .15s, transform .15s;
  display: flex; flex-direction: column; align-items: center; gap: .75rem;
}
.profile-card:hover, .profile-card:focus { border-color: var(--accent2); transform: scale(1.05);
  outline: none; }
.profile-card.active-card { border-color: var(--success); }
.avatar { font-size: 3.5rem; line-height: 1; }
.pname { font-size: 1.1rem; font-weight: 600; }
.ppin { font-size: .8rem; color: var(--muted); }
.active-badge { background: var(--success); color: #fff; font-size: .7rem;
  padding: .15rem .5rem; border-radius: 999px; }

.card-new { border-style: dashed; border-color: var(--border); color: var(--muted);
  min-height: 190px; justify-content: center; }
.card-new:hover { color: var(--accent2); }
.card-new svg { width: 2.5rem; height: 2.5rem; }

/* ── PIN screen ── */
#pinScreen { display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 1.5rem; padding: 2rem; }
#pinScreen .pin-avatar { font-size: 4rem; }
#pinScreen h2 { font-size: 1.2rem; }
.pin-dots { display: flex; gap: 1rem; }
.pin-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted);
  transition: background .1s; }
.pin-dot.filled { background: var(--accent2); border-color: var(--accent2); }
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
.num-btn { background: var(--card); border: 1px solid var(--border); color: var(--text);
  font-size: 1.5rem; padding: 1rem 1.5rem; border-radius: 12px; cursor: pointer;
  transition: background .1s; min-width: 80px; }
.num-btn:hover, .num-btn:focus { background: var(--accent); border-color: var(--accent); outline: none; }
#pinError { color: var(--danger); font-size: .9rem; min-height: 1.2rem; }
.btn-back { background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: .9rem; text-decoration: underline; }

/* ── Install bar ── */
#installBar { background: var(--card); border-top: 1px solid var(--border);
  padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  justify-content: center; }
#installBar span { font-size: .82rem; color: var(--muted); }
#installUrl { font-size: .78rem; font-family: monospace; color: var(--accent2); word-break: break-all; }
.btn-copy { background: var(--accent); color: #fff; border: none; border-radius: 8px;
  padding: .4rem .9rem; cursor: pointer; font-size: .82rem; }

/* ── Manage modal ── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none;
  align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
.overlay.open { display: flex; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 2rem; width: 100%; max-width: 400px; }
.modal h2 { margin-bottom: 1.25rem; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .3rem; }
.field input { width: 100%; background: #0d0d1a; border: 1px solid var(--border);
  border-radius: 8px; padding: .6rem .8rem; color: var(--text); font-size: .95rem; }
.field input:focus { outline: none; border-color: var(--accent); }
.avatars { display: flex; gap: .5rem; flex-wrap: wrap; }
.avatars span { font-size: 1.8rem; cursor: pointer; padding: .2rem; border-radius: 6px;
  border: 2px solid transparent; }
.avatars span.sel { border-color: var(--accent2); }
.row { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.25rem; }
.btn { padding: .5rem 1.1rem; border-radius: 8px; border: none; cursor: pointer;
  font-size: .88rem; font-weight: 500; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--danger); color: #fff; }

.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--success);
  color: #fff; padding: .75rem 1.25rem; border-radius: 10px; font-size: .9rem;
  transform: translateY(120px); transition: transform .3s; z-index: 200; }
.toast.show { transform: translateY(0); }
</style>
</head>
<body>
<header>
  <h1>🎬 Stremio <span>Perfiles</span></h1>
  <div id="activeBar" style="display:none">
    Perfil activo: <strong id="activeName"></strong>
    <button id="btnLogout" onclick="logout()">Cambiar</button>
  </div>
</header>

<!-- Profile selector -->
<main id="mainScreen">
  <h2 class="section">¿Quién eres?</h2>
  <div class="grid" id="profileGrid"></div>
</main>

<!-- PIN entry -->
<div id="pinScreen">
  <div class="pin-avatar" id="pinAvatar"></div>
  <h2 id="pinName"></h2>
  <div class="pin-dots" id="pinDots"></div>
  <div id="pinError"></div>
  <div class="numpad" id="numpad"></div>
  <button class="btn-back" onclick="showMain()">← Volver</button>
</div>

<!-- Install bar (bottom) -->
<div id="installBar">
  <span>Instala el addon en Stremio (una sola vez):</span>
  <span id="installUrl"></span>
  <button class="btn-copy" onclick="copyUrl()">Copiar URL</button>
</div>

<!-- Create/Edit modal -->
<div class="overlay" id="editModal">
  <div class="modal">
    <h2 id="editTitle">Nuevo Perfil</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label>Nombre</label>
      <input id="editName" type="text" placeholder="Ej: Ana, Niños…">
    </div>
    <div class="field">
      <label>Avatar</label>
      <div class="avatars" id="avatarPicker">
        👤🧑👨👩🧒👦👧🧓🎬🎮🎵📚🍿🦊🐱🐶
      </div>
    </div>
    <div class="field">
      <label>PIN (4 dígitos, opcional)</label>
      <input id="editPin" type="password" maxlength="4" placeholder="Dejar vacío = sin PIN">
    </div>
    <div class="row">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button id="btnDelete" class="btn btn-danger" onclick="deleteProfile()" style="display:none">Eliminar</button>
      <button class="btn btn-primary" onclick="saveProfile()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const AVATARS = ['👤','🧑','👨','👩','🧒','👦','👧','🧓','🎬','🎮','🎵','📚','🍿','🦊','🐱','🐶'];
let profiles = [], activeProfile = null, selectedAvatar = '👤', pinTarget = null, pinDigits = '';

const BASE = window.location.origin;

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: {'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

function toast(msg, color = 'var(--success)') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color;
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Install URL ──────────────────────────────────────────────────────
function renderInstallBar() {
  const url = `${BASE}/manifest.json`;
  document.getElementById('installUrl').textContent = url;
}

function copyUrl() {
  navigator.clipboard.writeText(`${BASE}/manifest.json`)
    .then(() => toast('URL copiada ✓'));
}

// ── Main screen ──────────────────────────────────────────────────────
async function load() {
  [profiles, activeProfile] = await Promise.all([
    api('GET', '/api/profiles'),
    api('GET', '/api/session'),
  ]);
  renderMain();
  renderInstallBar();
}

function renderMain() {
  const grid = document.getElementById('profileGrid');
  const header = document.getElementById('activeBar');

  if (activeProfile) {
    header.style.display = 'flex';
    document.getElementById('activeName').textContent = `${activeProfile.avatar} ${activeProfile.name}`;
  } else {
    header.style.display = 'none';
  }

  grid.innerHTML = '';
  profiles.forEach(p => {
    const isActive = activeProfile && activeProfile.id === p.id;
    const card = document.createElement('div');
    card.className = 'profile-card' + (isActive ? ' active-card' : '');
    card.tabIndex = 0;
    card.innerHTML = `
      <div class="avatar">${esc(p.avatar)}</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="ppin">${p.pin ? '🔒' : ''}</div>
      ${isActive ? '<span class="active-badge">Activo</span>' : ''}`;
    card.onclick = () => selectProfile(p);
    card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') selectProfile(p); };
    // Long-press / right-click to edit
    card.oncontextmenu = e => { e.preventDefault(); openEdit(p.id); };
    grid.appendChild(card);
  });

  // New profile button
  const newCard = document.createElement('div');
  newCard.className = 'profile-card card-new';
  newCard.tabIndex = 0;
  newCard.innerHTML = `<svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
    <span>Nuevo</span>`;
  newCard.onclick = () => openEdit(null);
  newCard.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') openEdit(null); };
  grid.appendChild(newCard);
}

function selectProfile(p) {
  if (p.pin) {
    showPin(p);
  } else {
    activateProfile(p.id, null);
  }
}

async function activateProfile(profileId, pin) {
  const r = await api('POST', '/api/session', { profileId, pin });
  if (r.error) { document.getElementById('pinError').textContent = r.error; return; }
  activeProfile = r.profile;
  showMain();
  toast(`Bienvenido, ${activeProfile.name} ${activeProfile.avatar}`);
}

async function logout() {
  await api('DELETE', '/api/session');
  activeProfile = null;
  renderMain();
}

// ── PIN screen ───────────────────────────────────────────────────────
function showPin(profile) {
  pinTarget = profile; pinDigits = '';
  document.getElementById('pinAvatar').textContent = profile.avatar;
  document.getElementById('pinName').textContent = profile.name;
  document.getElementById('pinError').textContent = '';
  renderPinDots();
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('pinScreen').style.display = 'flex';
  document.getElementById('numpad').innerHTML = '';

  [1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'num-btn'; btn.textContent = k; btn.tabIndex = 0;
    btn.onclick = () => pinKey(k);
    document.getElementById('numpad').appendChild(btn);
  });
}

function showMain() {
  document.getElementById('pinScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = '';
  load();
}

function renderPinDots() {
  document.getElementById('pinDots').innerHTML =
    [0,1,2,3].map(i => `<div class="pin-dot ${i < pinDigits.length ? 'filled' : ''}"></div>`).join('');
}

function pinKey(k) {
  if (k === '⌫') { pinDigits = pinDigits.slice(0,-1); renderPinDots(); return; }
  if (k === '✓') { if (pinDigits.length === 4) activateProfile(pinTarget.id, pinDigits); return; }
  if (pinDigits.length >= 4) return;
  pinDigits += k;
  renderPinDots();
  if (pinDigits.length === 4) activateProfile(pinTarget.id, pinDigits);
}

// ── Create/Edit modal ────────────────────────────────────────────────
function openEdit(id) {
  const p = profiles.find(x => x.id === id);
  document.getElementById('editId').value = id || '';
  document.getElementById('editName').value = p ? p.name : '';
  document.getElementById('editPin').value = '';
  document.getElementById('editTitle').textContent = p ? 'Editar Perfil' : 'Nuevo Perfil';
  document.getElementById('btnDelete').style.display = p ? 'inline-flex' : 'none';
  selectedAvatar = p ? p.avatar : '👤';

  const picker = document.getElementById('avatarPicker');
  picker.innerHTML = AVATARS.map(a =>
    `<span class="${a===selectedAvatar?'sel':''}" onclick="pickAvatar(this,'${a}')">${a}</span>`
  ).join('');

  document.getElementById('editModal').classList.add('open');
}

function pickAvatar(el, v) {
  selectedAvatar = v;
  document.querySelectorAll('#avatarPicker span').forEach(s => s.classList.remove('sel'));
  el.classList.add('sel');
}

function closeModal() { document.getElementById('editModal').classList.remove('open'); }

async function saveProfile() {
  const id = document.getElementById('editId').value;
  const name = document.getElementById('editName').value.trim();
  const pin = document.getElementById('editPin').value.trim();
  if (!name) return toast('El nombre es obligatorio', 'var(--danger)');
  const body = { name, avatar: selectedAvatar, pin: pin || null };
  if (id) await api('PUT', `/api/profiles/${id}`, body);
  else await api('POST', '/api/profiles', body);
  closeModal();
  await load();
  toast(id ? 'Perfil actualizado ✓' : 'Perfil creado ✓');
}

async function deleteProfile() {
  const id = document.getElementById('editId').value;
  if (!confirm('¿Eliminar este perfil?')) return;
  await api('DELETE', `/api/profiles/${id}`);
  closeModal();
  await load();
  toast('Perfil eliminado');
}

load();
</script>
</body>
</html>
