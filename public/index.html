<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stremio Perfiles</title>
<style>
  :root {
    --bg: #0f0f0f; --card: #1a1a2e; --accent: #7c3aed;
    --accent2: #a855f7; --text: #e5e7eb; --muted: #9ca3af;
    --border: #374151; --danger: #ef4444; --success: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 2rem;
    display: flex; align-items: center; gap: 1rem; }
  header h1 { font-size: 1.4rem; }
  header span { color: var(--accent2); }
  .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;
    transition: border-color .2s; }
  .card:hover { border-color: var(--accent); }
  .card-avatar { font-size: 2.5rem; margin-bottom: .5rem; }
  .card-name { font-size: 1.2rem; font-weight: 600; margin-bottom: .25rem; }
  .card-pin { font-size: .75rem; color: var(--muted); margin-bottom: 1rem; }
  .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem 1rem;
    border-radius: 8px; border: none; cursor: pointer; font-size: .85rem; font-weight: 500;
    transition: opacity .15s; text-decoration: none; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-sm { padding: .3rem .7rem; font-size: .78rem; }
  .card-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .75rem; }

  .install-url { font-size: .7rem; color: var(--muted); word-break: break-all;
    background: #0d0d1a; border-radius: 6px; padding: .4rem .6rem; margin-top: .75rem; }

  /* New profile card */
  .card-new { border-style: dashed; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-height: 200px; gap: .5rem;
    color: var(--muted); transition: color .2s, border-color .2s; }
  .card-new:hover { color: var(--accent2); border-color: var(--accent2); }
  .card-new svg { width: 2.5rem; height: 2.5rem; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
  .overlay.open { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 2rem; width: 100%; max-width: 420px; }
  .modal h2 { margin-bottom: 1.5rem; font-size: 1.2rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .3rem; }
  .field input, .field select { width: 100%; background: #0d0d1a; border: 1px solid var(--border);
    border-radius: 8px; padding: .6rem .8rem; color: var(--text); font-size: .95rem; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .avatars { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .3rem; }
  .avatars span { font-size: 1.6rem; cursor: pointer; padding: .2rem; border-radius: 6px;
    border: 2px solid transparent; transition: border-color .15s; }
  .avatars span.selected { border-color: var(--accent2); }
  .modal-actions { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.5rem; }

  /* Genres panel */
  .genres-grid { display: flex; flex-wrap: wrap; gap: .5rem; }
  .genre-chip { padding: .3rem .8rem; border-radius: 999px; border: 1px solid var(--border);
    cursor: pointer; font-size: .82rem; transition: background .15s, border-color .15s; }
  .genre-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* PIN modal */
  .pin-digits { display: flex; gap: .5rem; justify-content: center; margin: 1rem 0; }
  .pin-digits input { width: 3rem; text-align: center; font-size: 1.5rem; }

  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--success);
    color: #fff; padding: .75rem 1.25rem; border-radius: 10px; font-size: .9rem;
    transform: translateY(100px); transition: transform .3s; z-index: 200; }
  .toast.show { transform: translateY(0); }

  section.sub { margin-top: 2rem; }
  section.sub h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--muted); }
</style>
</head>
<body>
<header>
  <span>🎬</span>
  <h1>Stremio <span>Perfiles</span></h1>
</header>
<div class="container">
  <div id="profilesGrid" class="grid"></div>
</div>

<!-- Create/Edit modal -->
<div class="overlay" id="editModal">
  <div class="modal">
    <h2 id="editTitle">Nuevo Perfil</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label>Nombre</label>
      <input id="editName" type="text" placeholder="Ej: Ana, Niños, Trabajo…">
    </div>
    <div class="field">
      <label>Avatar</label>
      <div class="avatars" id="avatarPicker">
        <span data-v="👤">👤</span><span data-v="🧑">🧑</span><span data-v="👨">👨</span>
        <span data-v="👩">👩</span><span data-v="🧒">🧒</span><span data-v="👦">👦</span>
        <span data-v="👧">👧</span><span data-v="🧓">🧓</span><span data-v="🎬">🎬</span>
        <span data-v="🎮">🎮</span><span data-v="🎵">🎵</span><span data-v="📚">📚</span>
        <span data-v="🍿">🍿</span><span data-v="🦊">🦊</span><span data-v="🐱">🐱</span>
        <span data-v="🐶">🐶</span>
      </div>
    </div>
    <div class="field">
      <label>PIN (opcional — 4 dígitos)</label>
      <input id="editPin" type="password" maxlength="4" placeholder="Sin PIN = acceso libre">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('editModal')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProfile()">Guardar</button>
    </div>
  </div>
</div>

<!-- Genres modal -->
<div class="overlay" id="genresModal">
  <div class="modal" style="max-width:540px">
    <h2>Géneros favoritos — <span id="genresProfileName"></span></h2>
    <input type="hidden" id="genresProfileId">
    <div class="genres-grid" id="genresGrid"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('genresModal')">Cerrar</button>
      <button class="btn btn-primary" onclick="saveGenres()">Guardar</button>
    </div>
  </div>
</div>

<!-- PIN verify modal -->
<div class="overlay" id="pinModal">
  <div class="modal" style="max-width:320px; text-align:center">
    <h2>🔒 Introduce el PIN</h2>
    <div class="pin-digits">
      <input class="field input" type="password" maxlength="1" id="p0" oninput="pinNext(0)">
      <input class="field input" type="password" maxlength="1" id="p1" oninput="pinNext(1)">
      <input class="field input" type="password" maxlength="1" id="p2" oninput="pinNext(2)">
      <input class="field input" type="password" maxlength="1" id="p3" oninput="pinNext(3)">
    </div>
    <p id="pinError" style="color:var(--danger);font-size:.85rem;min-height:1.2rem"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn btn-outline" onclick="closeModal('pinModal')">Cancelar</button>
      <button class="btn btn-primary" onclick="submitPin()">Entrar</button>
    </div>
  </div>
</div>

<!-- Install modal -->
<div class="overlay" id="installModal">
  <div class="modal">
    <h2>📲 Instalar en Stremio</h2>
    <p style="color:var(--muted);font-size:.88rem;margin-bottom:1rem">
      Usa la URL del manifest para instalar este perfil como addon en Stremio.
    </p>
    <div class="field">
      <label>URL del Manifest</label>
      <div class="install-url" id="installUrl" style="font-size:.85rem;color:var(--text)"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('installModal')">Cerrar</button>
      <button class="btn btn-outline" onclick="copyInstallUrl()">📋 Copiar</button>
      <a class="btn btn-primary" id="installLink" href="#" target="_blank">Abrir en Stremio Web</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const AVATARS = ['👤','🧑','👨','👩','🧒','👦','👧','🧓','🎬','🎮','🎵','📚','🍿','🦊','🐱','🐶'];
const ALL_GENRES = ['Acción','Aventura','Animación','Comedia','Crimen','Documental',
  'Drama','Fantasía','Terror','Misterio','Romance','Ciencia Ficción','Thriller','Western','Historia','Música'];

let profiles = [];
let selectedAvatar = '👤';
let selectedGenres = [];
let pinCallback = null;

async function api(method, path, body) {
  const r = await fetch(path, {
    method, headers: {'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined
  });
  return r.json();
}

function showToast(msg, color = 'var(--success)') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function loadProfiles() {
  profiles = await api('GET', '/api/profiles');
  render();
}

function render() {
  const grid = document.getElementById('profilesGrid');
  grid.innerHTML = '';

  profiles.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-avatar">${p.avatar}</div>
      <div class="card-name">${esc(p.name)}</div>
      <div class="card-pin">${p.pin ? '🔒 PIN activado' : '🔓 Sin PIN'}</div>
      <div class="install-url">${esc(p.installUrl)}</div>
      <div class="card-actions">
        <button class="btn btn-primary btn-sm" onclick="openInstall('${p.id}')">📲 Instalar</button>
        <button class="btn btn-outline btn-sm" onclick="openGenres('${p.id}')">🎭 Géneros</button>
        <button class="btn btn-outline btn-sm" onclick="openEdit('${p.id}')">✏️ Editar</button>
        <button class="btn btn-danger btn-sm" onclick="deleteProfile('${p.id}')">🗑️</button>
      </div>`;
    grid.appendChild(card);
  });

  // New profile button
  const newCard = document.createElement('div');
  newCard.className = 'card card-new';
  newCard.onclick = () => openEdit(null);
  newCard.innerHTML = `<svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
    <span>Nuevo Perfil</span>`;
  grid.appendChild(newCard);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openEdit(id) {
  const p = profiles.find(x => x.id === id);
  document.getElementById('editId').value = id || '';
  document.getElementById('editName').value = p ? p.name : '';
  document.getElementById('editPin').value = '';
  document.getElementById('editTitle').textContent = p ? 'Editar Perfil' : 'Nuevo Perfil';
  selectedAvatar = p ? p.avatar : '👤';
  document.querySelectorAll('#avatarPicker span').forEach(s => {
    s.classList.toggle('selected', s.dataset.v === selectedAvatar);
  });
  openModal('editModal');
}

document.querySelectorAll('#avatarPicker span').forEach(s => {
  s.onclick = () => {
    selectedAvatar = s.dataset.v;
    document.querySelectorAll('#avatarPicker span').forEach(x => x.classList.remove('selected'));
    s.classList.add('selected');
  };
});

async function saveProfile() {
  const id = document.getElementById('editId').value;
  const name = document.getElementById('editName').value.trim();
  const pin = document.getElementById('editPin').value.trim();
  if (!name) return showToast('El nombre es obligatorio', 'var(--danger)');
  const body = { name, avatar: selectedAvatar, pin: pin || null };
  if (id) {
    await api('PUT', `/api/profiles/${id}`, body);
  } else {
    await api('POST', '/api/profiles', body);
  }
  closeModal('editModal');
  await loadProfiles();
  showToast(id ? 'Perfil actualizado' : 'Perfil creado ✓');
}

async function deleteProfile(id) {
  if (!confirm('¿Eliminar este perfil y toda su información?')) return;
  await api('DELETE', `/api/profiles/${id}`);
  await loadProfiles();
  showToast('Perfil eliminado');
}

async function openGenres(id) {
  const p = profiles.find(x => x.id === id);
  document.getElementById('genresProfileId').value = id;
  document.getElementById('genresProfileName').textContent = `${p.avatar} ${p.name}`;
  selectedGenres = await api('GET', `/api/profiles/${id}/genres`);
  const grid = document.getElementById('genresGrid');
  grid.innerHTML = ALL_GENRES.map(g => `
    <span class="genre-chip ${selectedGenres.includes(g) ? 'active' : ''}"
      onclick="toggleGenre(this,'${g}')">${g}</span>`).join('');
  openModal('genresModal');
}

function toggleGenre(el, genre) {
  el.classList.toggle('active');
  if (selectedGenres.includes(genre)) {
    selectedGenres = selectedGenres.filter(g => g !== genre);
  } else {
    selectedGenres.push(genre);
  }
}

async function saveGenres() {
  const id = document.getElementById('genresProfileId').value;
  await api('PUT', `/api/profiles/${id}/genres`, { genres: selectedGenres });
  closeModal('genresModal');
  showToast('Géneros guardados ✓');
}

function openInstall(id) {
  const p = profiles.find(x => x.id === id);
  document.getElementById('installUrl').textContent = p.installUrl;
  const stremioUrl = `stremio://${p.installUrl.replace(/^https?:\/\//, '')}`;
  document.getElementById('installLink').href = stremioUrl;
  openModal('installModal');
}

function copyInstallUrl() {
  const url = document.getElementById('installUrl').textContent;
  navigator.clipboard.writeText(url).then(() => showToast('URL copiada ✓'));
}

// PIN
function pinNext(i) {
  if (document.getElementById('p'+i).value && i < 3)
    document.getElementById('p'+(i+1)).focus();
}

function submitPin() {
  const pin = [0,1,2,3].map(i => document.getElementById('p'+i).value).join('');
  if (pinCallback) pinCallback(pin);
}

function requirePin(profileId, cb) {
  const p = profiles.find(x => x.id === profileId);
  if (!p.pin) return cb();
  [0,1,2,3].forEach(i => document.getElementById('p'+i).value = '');
  document.getElementById('pinError').textContent = '';
  openModal('pinModal');
  pinCallback = async (pin) => {
    const r = await api('POST', `/api/profiles/${profileId}/verify-pin`, { pin });
    if (r.ok) { closeModal('pinModal'); cb(); }
    else document.getElementById('pinError').textContent = 'PIN incorrecto';
  };
}

loadProfiles();
</script>
</body>
</html>
