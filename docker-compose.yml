services:
  stremio-profiles:
    build: .
    container_name: stremio-profiles
    restart: unless-stopped
    ports:
      - "100.118.11.112:7000:7000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=7000
      - BASE_URL=${BASE_URL:-http://100.118.11.112:7000}
      - DB_PATH=/app/data/profiles.db
